name: teardown

# Manual only. There is no push trigger and there never should be.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm. Anything else aborts.'
        required: true
        default: ''
  # Callable, so the full-cycle workflow can prove deploy and undeploy in one
  # run. The confirmation is still required - the caller has to pass it.
  workflow_call:
    inputs:
      confirm:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production      # shares the deploy lock: never both at once
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  PREFIX: mcb

jobs:
  destroy:
    name: delete every stack except bootstrap
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: check confirmation
        if: inputs.confirm != 'DESTROY'
        run: |
          echo "Confirmation was '${{ inputs.confirm }}', not DESTROY. Aborting."
          exit 1

      - uses: actions/checkout@v4

      - name: assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-teardown-${{ github.run_id }}

      # This account holds Redshift Serverless resources that predate the
      # project and belong to no stack: `default-namespace` and
      # `default-workgroup`. They are OUT OF SCOPE and must survive every
      # teardown.
      #
      # They are already safe by construction - teardown deletes named mcb-*
      # stacks, and these are in none of them - but "safe by construction" is
      # an assumption until something checks it. Recorded here, compared at
      # the end.
      - name: record out-of-scope resources
        run: |
          aws redshift-serverless list-namespaces --query 'namespaces[?!starts_with(namespaceName, `mcb-`)].namespaceName' --output text | xargs -n1 | sort > /tmp/ns-before.txt
          aws redshift-serverless list-workgroups --query 'workgroups[?!starts_with(workgroupName, `mcb-`)].workgroupName' --output text | xargs -n1 | sort > /tmp/wg-before.txt
          echo "namespaces that must survive:"; cat /tmp/ns-before.txt
          echo "workgroups that must survive:"; cat /tmp/wg-before.txt

      # Proven necessary, not assumed: a delete with objects in the buckets
      # fails with `409 ... not empty`, and ONLY the buckets fail. DynamoDB
      # tables and the ECR repository (EmptyOnDelete) clean themselves up.
      #
      # The bucket names are read from the stack that owns them rather than
      # discovered with `s3api list-buckets`. Enumerating needs
      # s3:ListAllMyBuckets, which the deploy role does not have and should
      # not need - and when that call was denied the loop simply ran zero
      # times and emptied nothing, silently, until the stack delete failed
      # twenty-five minutes later.
      - name: empty application buckets
        run: |
          set -o pipefail
          if ! aws cloudformation describe-stacks --stack-name ${PREFIX}-foundation >/dev/null 2>&1; then
            echo "mcb-foundation absent; no buckets to empty"
            exit 0
          fi
          out() { aws cloudformation describe-stacks --stack-name ${PREFIX}-foundation --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          for key in CorpusBucketName DocumentsBucketName; do
            b=$(out "$key")
            if [ -z "$b" ] || [ "$b" = "None" ]; then
              echo "no output for $key"; exit 1
            fi
            # A partially-failed teardown can leave the stack standing with
            # some of its buckets already gone. That is a re-run, not an
            # error - but a bucket that exists and will not empty still is.
            if ! aws s3api head-bucket --bucket "$b" >/dev/null 2>&1; then
              echo "$b already gone"
              continue
            fi
            echo "emptying $b"
            # No `|| true`. If this cannot empty the bucket, the stack delete
            # will fail anyway - better to say so here, loudly, than to fail
            # opaquely much later.
            aws s3 rm "s3://$b" --recursive --only-show-errors
            left=$(aws s3 ls "s3://$b" --recursive | wc -l)
            echo "  $left objects remain"
            [ "$left" -eq 0 ] || { echo "could not empty $b"; exit 1; }
          done

      # Reverse of creation order. A stack that does not exist is not an
      # error - teardown has to be re-runnable after a partial failure.
      - name: delete stacks
        run: |
          for s in agent tools knowledge data foundation; do
            name="${PREFIX}-${s}"
            if aws cloudformation describe-stacks --stack-name "$name" >/dev/null 2>&1; then
              echo "::group::deleting $name"
              aws cloudformation delete-stack --stack-name "$name" --role-arn ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
              if ! aws cloudformation wait stack-delete-complete --stack-name "$name"; then
                echo "delete failed for $name; reasons:"
                aws cloudformation describe-stack-events --stack-name "$name" --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceStatusReason]" --output text
                exit 1
              fi
              echo "::endgroup::"
            else
              echo "$name absent, nothing to do"
            fi
          done

      # A verification, not a hope - but it has to be right about what
      # "survives" means, in two ways.
      #
      # 1. Some things are SUPPOSED to survive: mcb-bootstrap and its
      #    artifacts bucket (what this workflow authenticated with), and the
      #    SSM parameter holding the Redshift password. That parameter is the
      #    store of record - deleting it would make the NEXT deploy fail, so
      #    it deliberately outlives the stacks, like bootstrap does.
      #
      # 2. The tagging API lags. It kept returning VPC endpoints and a
      #    Cognito user pool that CloudFormation had already deleted, so a
      #    single query fails a teardown that actually worked. Anything still
      #    listed after several attempts is a real orphan; anything that
      #    disappears was just the index catching up.
      - name: verify nothing of ours survives
        run: |
          survivors() {
            aws resourcegroupstaggingapi get-resources --tag-filters "Key=Project,Values=${PREFIX}" --query 'ResourceTagMappingList[].ResourceARN' --output text               | xargs -n1               | grep -v ":stack/${PREFIX}-bootstrap/"               | grep -v ":::${PREFIX}-artifacts-"               | grep -v ":parameter/${PREFIX}/"               || true
          }
          for attempt in 1 2 3 4 5; do
            survivors > /tmp/survivors.txt
            if [ ! -s /tmp/survivors.txt ]; then
              echo "clean on attempt $attempt"
              echo "only mcb-bootstrap, its artifacts bucket and the SSM parameters remain, by design"
              exit 0
            fi
            echo "attempt $attempt still lists $(wc -l < /tmp/survivors.txt):"
            cat /tmp/survivors.txt
            sleep 30
          done
          echo "these resources outlived teardown after five attempts:"
          cat /tmp/survivors.txt
          exit 1

      # The other half of the guard. Deleting something the project does not
      # own is a worse failure than leaving something behind, so this runs
      # even when an earlier step failed.
      - name: out-of-scope resources still intact
        if: always()
        run: |
          aws redshift-serverless list-namespaces --query 'namespaces[?!starts_with(namespaceName, `mcb-`)].namespaceName' --output text | xargs -n1 | sort > /tmp/ns-after.txt
          aws redshift-serverless list-workgroups --query 'workgroups[?!starts_with(workgroupName, `mcb-`)].workgroupName' --output text | xargs -n1 | sort > /tmp/wg-after.txt
          ok=0
          diff -u /tmp/ns-before.txt /tmp/ns-after.txt || ok=1
          diff -u /tmp/wg-before.txt /tmp/wg-after.txt || ok=1
          if [ "$ok" -ne 0 ]; then
            echo "TEARDOWN TOUCHED SOMETHING IT DOES NOT OWN"
            exit 1
          fi
          echo "pre-existing Redshift namespaces and workgroups are untouched"
