AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mcb-agent - the agent on AgentCore Runtime, spoken to over AG-UI.
  Highest-churn stack: it changes on every commit, which is why the slow
  resources live elsewhere.

Parameters:
  Prefix:
    Type: String
    Default: mcb
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  ContainerUri:
    Type: String
    Description: ECR image URI including the tag, pushed by the deploy workflow.
  GuardrailId:
    Type: String
    Default: ''
    Description: From mcb-guardrails. Empty runs the agent with no guardrail.
  GuardrailVersion:
    Type: String
    Default: DRAFT
  GuardrailBlockedMessage:
    Type: String
    Default: ''
    Description: >-
      What the guardrail says to the customer when it stops an answer. The
      agent needs it in order to keep that sentence out of the model's own
      context - Bedrock returns it as the assistant's content, and a model
      shown its own apparent refusal will write it again unprompted.
  KnowledgeBaseId:
    Type: String
    Default: ''
    Description: From mcb-knowledge. Empty falls back to the local corpus.
  GatewayUrl:
    Type: String
    Default: ''
  ModelId:
    Type: String
    Default: moonshotai.kimi-k2.5
  SmallModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
  IdleSessionTimeoutSeconds:
    Type: Number
    Default: 300
    Description: >
      Runtime MEMORY is billed for every second a session is alive, idle
      included - only CPU stops during I/O wait. The platform default is 900;
      300 is chosen so an abandoned conversation stops costing sooner.
  MaxLifetimeSeconds:
    Type: Number
    Default: 3600

Resources:

  # Assumed by AgentCore itself, so written by hand.
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-agent-runtime"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PullImage
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"
              - Sid: Telemetry
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - cloudwatch:PutMetricData
                Resource: '*'
              # Inference. Scoped to the two models this build uses plus the
              # inference profiles that front them - a wildcard here would let
              # a prompt-injected agent reach any model in the account.
              # A CROSS-REGION inference profile needs the foundation model
              # in EVERY region it can route to, not just this one.
              # `apac.amazon.nova-lite-v1:0` fans out to six APAC regions, so
              # granting only ap-south-1 denied roughly five calls in six -
              # silently, because the verifier and the summariser both fail
              # open. The trace said `verifier: AccessDeniedException` and
              # the answers looked fine.
              - Sid: Inference
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Sid: Retrieve
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
              # Two calls, two purposes. InvokeModel carries the guardrail
              # inline on the Converse request; ApplyGuardrail is the separate
              # call for text the model never generated - retrieved passages,
              # tool results, an inbound WhatsApp message.
              - Sid: Guardrail
                Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"
              # The two checkpointers and the two long-term stores. Named, not
              # wildcarded: this role has no business in any other table.
              - Sid: Checkpoints
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-checkpoints"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-resolver"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-profiles"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-audit"
              # Documents are written here and referenced by metadata only;
              # their bytes never enter a checkpoint.
              - Sid: Documents
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${Prefix}-documents-${AWS::AccountId}"
                  - !Sub "arn:${AWS::Partition}:s3:::${Prefix}-documents-${AWS::AccountId}/*"
              # The Cognito client secret used to mint the Gateway JWT.
              - Sid: GatewayCredentials
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Prefix}/gateway/*"
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  Runtime:
    Type: AWS::BedrockAgentCore::Runtime
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # The name pattern is [a-zA-Z][a-zA-Z0-9_]{0,47} - underscores, NOT the
      # hyphens every other resource here uses.
      AgentRuntimeName: !Sub
        - "${p}_agent"
        - p: !Join ['_', !Split ['-', !Ref Prefix]]
      Description: Protec multi-channel bot, AG-UI over AgentCore Runtime.
      RoleArn: !GetAtt RuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ContainerUri
      # The decision from the plan: the console talks AG-UI, so the process
      # streams and the answer is emitted once the guardrail has passed it.
      ProtocolConfiguration: AGUI
      NetworkConfiguration:
        NetworkMode: PUBLIC
      LifecycleConfiguration:
        IdleRuntimeSessionTimeout: !Ref IdleSessionTimeoutSeconds
        MaxLifetime: !Ref MaxLifetimeSeconds
      EnvironmentVariables:
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_MODEL_ID: !Ref ModelId
        BEDROCK_SMALL_MODEL_ID: !Ref SmallModelId
        DDB_CHECKPOINT_TABLE: !Sub "${Prefix}-checkpoints"
        DDB_RESOLVER_TABLE: !Sub "${Prefix}-resolver"
        DDB_PROFILE_TABLE: !Sub "${Prefix}-profiles"
        DDB_AUDIT_TABLE: !Sub "${Prefix}-audit"
        S3_BUCKET: !Sub "${Prefix}-documents-${AWS::AccountId}"
        GUARDRAIL_ID: !Ref GuardrailId
        GUARDRAIL_VERSION: !Ref GuardrailVersion
        GUARDRAIL_BLOCKED_MESSAGE: !Ref GuardrailBlockedMessage
        KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
        GATEWAY_URL: !Ref GatewayUrl
        SSM_PREFIX: !Sub "/${Prefix}"
      Tags:
        Project: !Ref Prefix

  # A named endpoint so callers have a stable address to invoke.
  #
  # THE TRAP, and it is the same one Bedrock Guardrails has: an endpoint pins
  # to a runtime VERSION, and updating the runtime does not move it. Without
  # the explicit AgentRuntimeVersion below, the runtime went to version 4
  # with a new image while `live` went on serving version 1 - so every deploy
  # built and pushed an image that nobody was serving, and the stack reported
  # success each time.
  #
  # Binding it to the runtime's current version means a new image is actually
  # what answers.
  RuntimeEndpoint:
    Type: AWS::BedrockAgentCore::RuntimeEndpoint
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: live
      AgentRuntimeId: !GetAtt Runtime.AgentRuntimeId
      AgentRuntimeVersion: !GetAtt Runtime.AgentRuntimeVersion
      Description: The endpoint callers invoke. Follows the runtime version.

Outputs:
  AgentRuntimeArn:
    Value: !GetAtt Runtime.AgentRuntimeArn
    Export: { Name: !Sub "${Prefix}-agent-runtime-arn" }
  AgentRuntimeId:
    Value: !GetAtt Runtime.AgentRuntimeId
    Export: { Name: !Sub "${Prefix}-agent-runtime-id" }
  AgentRuntimeVersion:
    Value: !GetAtt Runtime.AgentRuntimeVersion
  RuntimeStatus:
    Value: !GetAtt Runtime.Status
