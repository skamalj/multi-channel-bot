AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mcb-guardrails - Bedrock Guardrails for the Protec bot. Deployed and torn
  down with everything else, because a safety control that only exists on
  somebody's laptop is not a control.

# WHAT THIS DOES AND DOES NOT REPLACE
#
# Bedrock Guardrails and our own citation guardrail answer different
# questions, and keeping both is deliberate:
#
#   Bedrock contextual grounding asks "is this response supported by the
#   source material, probabilistically?" and scores it.
#
#   app/agents/citations.py asks "does every material claim carry a citation
#   id that RESOLVES to a document we actually retrieved?" and rewrites the
#   answer if not.
#
# The second is a rule, not a score. A fabricated premium that happens to read
# as well-grounded passes a threshold; it does not pass "name the document".
# Conversely, grounding catches drift in prose that carries no figure at all,
# which the citation rule was never designed to see. Neither is a superset.

Parameters:
  Prefix:
    Type: String
    Default: mcb
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
  GroundingThreshold:
    Type: Number
    Default: 0.4
    Description: >-
      An ALARM level, not a gate. Grounding is recorded and watched; it
      does not block, because it cannot reliably tell a good answer from a
      fabricated one on this bot's output style - measured below.

      CALIBRATED, not chosen. It started at 0.75 on the reasoning that a wrong
      answer about cover costs more than a refusal, and that number refused a
      GOOD answer in production: the knowledge base returned the right four
      chunks, the citation guardrail passed it with three resolved citations
      and no hallucinations, and grounding scored 0.56 because the model had
      paraphrased across several passages rather than quoting one.

      Measured separation, from real calls against this guardrail:
        fabricated answer, contradicting the source .... 0.00
        verbatim from a single passage ................. 1.00
        correct answer paraphrased across passages ..... 0.56

      0.4 passes the third and still blocks the first. A guardrail that
      refuses correct answers is not cautious, it is broken - the customer
      gets nothing and a colleague gets the call. Few samples; revisit with
      more.
  RelevanceThreshold:
    Type: Number
    Default: 0.5
    Description: How related the response must be to what was actually asked.
  BlockedOutputsMessage:
    Type: String
    Default: >-
      I could not give you a reliable answer to that, so I would rather not
      guess. Shall I put you through to a colleague who can check it properly?
    Description: >-
      What the customer sees when the guardrail stops an answer. Exported so
      the agent can recognise it coming back as the model's own words.
  PolicyRevision:
    Type: String
    Default: manual
    Description: >-
      A hash of this template, supplied by the deploy workflow. It exists to
      force a NEW guardrail version whenever the policy changes - see the
      comment on GuardrailVersion. Never set this by hand outside a test.

Resources:

  Guardrail:
    Type: AWS::Bedrock::Guardrail
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${Prefix}-protec"
      Description: Content, topic, PII and grounding controls for the Protec bot.

      # The customer never sees the machinery. These read as something a
      # person would say, and both offer the way out that the rest of the
      # system offers - a colleague who can check properly.
      BlockedInputMessaging: >-
        I am not able to help with that here. If it is about your policy or a
        claim, I can put you through to a colleague who can.
      # A parameter rather than a literal, and exported below, because the
      # agent has to be able to RECOGNISE this sentence. Bedrock returns it
      # as the assistant's own content; stored that way it comes back as the
      # model's prior answer and the model copies it - a thread that is
      # blocked once then refuses everything, with nothing blocking it. Two
      # copies of the wording would drift, and the day they drifted the agent
      # would stop recognising it.
      BlockedOutputsMessaging: !Ref BlockedOutputsMessage

      ContentPolicyConfig:
        FiltersConfig:
          # PROMPT_ATTACK is input-only by definition - AWS rejects an output
          # strength on it.
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: MEDIUM
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: MEDIUM
            OutputStrength: HIGH
          # Misconduct covers "how do I get a claim paid for damage I caused
          # deliberately" - a real question an insurance bot is asked.
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH

      TopicPolicyConfig:
        TopicsConfig:
          # Regulated advice. The bot may explain what a product covers; it
          # may not tell someone what to buy or what their diagnosis means.
          - Name: PersonalisedInvestmentAdvice
            Type: DENY
            Definition: >-
              Recommending specific investments, comparing insurance to
              investment products as a savings vehicle, projecting returns, or
              telling a customer what financial decision to make for their
              circumstances.
            Examples:
              - Should I buy ULIP or put the money in a mutual fund?
              - Is this policy a good investment for my retirement?
              - What return will I get if I pay premiums for ten years?
          - Name: MedicalAdvice
            Type: DENY
            # Topic definitions are capped at 200 characters. The first
            # attempt at this one was ~330 and the stack update was rejected,
            # so it says the same thing tersely.
            Definition: >-
              Any clinical judgement about a person's health: naming a
              condition, interpreting symptoms, lab values, scans or reports,
              recommending treatment or medication, or advising whether to
              seek care.
            Examples:
              # Probed against the deployed guardrail: the first two were
              # caught by the original definition and the third was not, so
              # the definition now names lab values and reports explicitly.
              - I have chest pain and shortness of breath, should I see a doctor?
              - Should I delay my surgery until the waiting period ends?
              - My reports show high creatinine, what disease do I have?
              - My blood test shows a high value, what does that mean?
              - Should I stop taking this medication before the health check?
          - Name: LegalAdvice
            Type: DENY
            Definition: >-
              Advising on legal strategy, the merits of litigation, or how to
              present a case against an insurer or another party.
            Examples:
              - Can I sue you if the claim is rejected?
              - What should I say to the police about the accident?
          # There is no CompetitorDisparagement topic here any more, and
          # taking it out was a judgement about false positives, so the
          # measurements are worth keeping. ApplyGuardrail, 5 runs each,
          # against the OUTPUT side:
          #
          #   "I will search for information about Health Secure in our
          #    approved sources."                          BLOCKED 5/5
          #   "Let me look that up in our approved sources."   clean 5/5
          #   "Protec Health Secure covers hospitalisation
          #    after a 30-day waiting period."                clean 5/5
          #   "Our claims record is better than Star Health
          #    and they reject more claims."               BLOCKED 5/5
          #
          # It blocked the bot narrating its own search - deterministically,
          # and the customer saw the block message with nothing wrong having
          # happened. It also blocked the sales objection pack, whose section
          # 10.1 is "It is cheaper elsewhere", which is corpus content the
          # producer bot is meant to use.
          #
          # What it caught correctly is already caught twice over: a claim
          # about a rival's claims record has no supporting passage, so the
          # verifier drops the sentence and the citation rule refuses the
          # turn. Two controls that read the actual answer beat one that
          # fires on the word "Health Secure".

      # PII is where an insurance bot needs care. It legitimately handles the
      # customer's own name, phone number and policy references - masking
      # those would break the product. What is masked is what the bot has no
      # business repeating back.
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: BLOCK
          - Type: CREDIT_DEBIT_CARD_CVV
            Action: BLOCK
          - Type: CREDIT_DEBIT_CARD_EXPIRY
            Action: BLOCK
          - Type: PIN
            Action: BLOCK
          - Type: PASSWORD
            Action: BLOCK
          - Type: AWS_ACCESS_KEY
            Action: BLOCK
          - Type: AWS_SECRET_KEY
            Action: BLOCK
          # Anonymised rather than blocked: a customer may well type their own
          # email or address, and refusing the turn would be worse service
          # than continuing without echoing it.
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: INTERNATIONAL_BANK_ACCOUNT_NUMBER
            Action: ANONYMIZE
        # There are no custom regexes here, deliberately.
        #
        # There were two - PAN and Aadhaar - and the Aadhaar one was set to
        # BLOCK on twelve digits beginning 2-9. That is also the shape of an
        # Indian mobile number written with its country code: the pattern
        # matched 919820000009, a seeded customer's own number and their
        # thread id. One echo of a customer's phone number would have
        # destroyed the whole answer and shown them the block message.
        #
        # No pattern can separate those two, because they are the same twelve
        # digits. The entity types above are ML classifiers rather than
        # shapes, which is why they stay. The cost of this is stated plainly:
        # Aadhaar and PAN are no longer specifically detected. Card numbers,
        # CVV, PIN, passwords, AWS keys, email and IBAN still are.

      WordPolicyConfig:
        ManagedWordListsConfig:
          - Type: PROFANITY

      # The hallucination control. Requires a grounding source at invoke time,
      # which is why it is applied where the retrieved passages are known -
      # see app/agents/guardrail.py.
      ContextualGroundingPolicyConfig:
        FiltersConfig:
          - Type: GROUNDING
            Threshold: !Ref GroundingThreshold
          - Type: RELEVANCE
            Threshold: !Ref RelevanceThreshold

      Tags:
        - { Key: Project, Value: !Ref Prefix }

  # A guardrail is always DRAFT until versioned, and the agent points at a
  # fixed version so that editing the guardrail cannot silently change the
  # behaviour of a running deployment.
  #
  # THE TRAP: a version is an immutable snapshot, and updating the guardrail
  # does NOT produce a new one. Found the hard way - after tightening a topic
  # definition, DRAFT had the new policy and version 1 still had the old one,
  # so the change deployed cleanly and did nothing. The agent would have gone
  # on running the policy we thought we had replaced.
  #
  # PolicyRevision is a hash of this file, so any policy change alters the
  # Description, CloudFormation replaces this resource, and a new version is
  # cut automatically.
  GuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      GuardrailIdentifier: !GetAtt Guardrail.GuardrailId
      Description: !Sub "Deployed version. Policy revision ${PolicyRevision}."


Outputs:
  GuardrailId:
    Value: !GetAtt Guardrail.GuardrailId
    Export: { Name: !Sub "${Prefix}-guardrail-id" }
  GuardrailArn:
    Value: !GetAtt Guardrail.GuardrailArn
    Export: { Name: !Sub "${Prefix}-guardrail-arn" }
  GuardrailVersion:
    Value: !GetAtt GuardrailVersion.Version
    Export: { Name: !Sub "${Prefix}-guardrail-version" }
  BlockedOutputsMessage:
    Description: >-
      The agent keeps this out of the model's own context. See the comment on
      BlockedOutputsMessaging.
    Value: !Ref BlockedOutputsMessage
    Export: { Name: !Sub "${Prefix}-guardrail-blocked-message" }
